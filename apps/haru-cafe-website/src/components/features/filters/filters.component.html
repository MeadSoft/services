<div class="flex flex-col w-full gap-0.5">
    @for (tagNode of tagGraphService.getNodes(); track $index) {
        <mat-button-toggle-group
            class="w-full !grid"
            hideMultipleSelectionIndicator
            hideSingleSelectionIndicator
            [ngStyle]="getStyle(tagNode)"
        >
            @for (tagId of tagNode.childTagIds; track $index) {
                <mat-button-toggle
                    [value]="tagId"
                    class="col-span-1"
                    (change)="onToggleButtonClicked($event)"
                    [checked]="tagGraphService.isCategorySelected(tagId)"
                    >{{ tagId }}</mat-button-toggle
                >
            }
        </mat-button-toggle-group>
    }
</div>
