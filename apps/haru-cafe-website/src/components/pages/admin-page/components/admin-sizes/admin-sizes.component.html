<div class="flex justify-between items-center mb-4">
    <h2 class="text-lg font-semibold text-zinc-800 dark:text-zinc-200">Sizes</h2>
    <p-button label="Add Size" icon="pi pi-plus" (onClick)="openCreate()" />
</div>

<p-table
    [value]="sizes.value()"
    [loading]="sizes.isLoading()"
    [paginator]="true"
    [rows]="15"
    styleClass="p-datatable-sm"
>
    <ng-template pTemplate="header">
        <tr>
            <th>Name</th>
            <th class="w-28"></th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-size>
        <tr>
            <td>{{ size.name }}</td>
            <td class="flex gap-2">
                <p-button
                    icon="pi pi-pencil"
                    [text]="true"
                    size="small"
                    (onClick)="openEdit(size)"
                />
                <p-button
                    icon="pi pi-trash"
                    [text]="true"
                    severity="danger"
                    size="small"
                    (onClick)="deleteSize(size)"
                />
            </td>
        </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
        <tr>
            <td colspan="2" class="text-center text-zinc-400 py-8">No sizes found.</td>
        </tr>
    </ng-template>
</p-table>

<p-dialog
    [header]="editingSize() ? 'Edit Size' : 'Add Size'"
    [visible]="showDialog()"
    (visibleChange)="$event ? null : closeDialog()"
    [modal]="true"
    [style]="{ width: '24rem' }"
    [draggable]="false"
>
    <div class="flex flex-col gap-4 pt-2">
        @if (error()) {
            <p class="text-sm text-red-600 dark:text-red-400">{{ error() }}</p>
        }
        <div class="flex flex-col gap-1">
            <label class="text-sm font-medium text-zinc-700 dark:text-zinc-300">Name *</label>
            <input
                pInputText
                [value]="formName()"
                (input)="formName.set($any($event.target).value)"
                placeholder="Size name"
                class="w-full"
            />
        </div>
    </div>

    <ng-template pTemplate="footer">
        <div class="flex justify-end gap-2">
            <p-button label="Cancel" [text]="true" (onClick)="closeDialog()" />
            <p-button
                [label]="saving() ? 'Saving…' : 'Save'"
                [loading]="saving()"
                (onClick)="save()"
            />
        </div>
    </ng-template>
</p-dialog>
