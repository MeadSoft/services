<div class="min-h-screen bg-zinc-50 dark:bg-zinc-900 p-6">
    <h1 class="text-2xl font-bold text-zinc-900 dark:text-zinc-100 mb-6">Admin</h1>

    <!-- Tab bar -->
    <div class="flex gap-1 border-b border-zinc-200 dark:border-zinc-700 mb-6">
        @for (tab of tabs; track tab.id) {
            <button
                (click)="setTab(tab.id)"
                class="px-4 py-2 text-sm font-medium rounded-t transition-colors"
                [class]="activeTab() === tab.id
                    ? 'border-b-2 border-zinc-900 dark:border-zinc-100 text-zinc-900 dark:text-zinc-100'
                    : 'text-zinc-500 dark:text-zinc-400 hover:text-zinc-700 dark:hover:text-zinc-200'"
            >
                {{ tab.label }}
            </button>
        }
    </div>

    <!-- Tab panels -->
    @if (activeTab() === 'menu-items') {
        <haru-admin-menu-items />
    }
    @if (activeTab() === 'tags') {
        <haru-admin-tags />
    }
    @if (activeTab() === 'sizes') {
        <haru-admin-sizes />
    }
</div>
