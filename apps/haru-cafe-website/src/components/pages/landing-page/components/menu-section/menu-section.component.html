<!-- menu -->
<div
    id="menu"
    class="bg-cyan-50 dark:bg-cyan-700 lg:px-40 md:px-20 px-4 lg:py-8 py-4 flex flex-col gap-8 transition"
>
    <div class="mx-auto flex gap-3 haru-card">
        <mat-icon class="text-cyan-600">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                height="24px"
                viewBox="0 -960 960 960"
                width="24px"
                fill="#00dddd"
            >
                <path
                    d="M640-80q-100 0-170-70t-70-170q0-100 70-170t170-70q100 0 170 70t70 170q0 100-70 170T640-80Zm0-80q66 0 113-47t47-113q0-66-47-113t-113-47q-66 0-113 47t-47 113q0 66 47 113t113 47Zm-480 0q-33 0-56.5-23.5T80-240v-304q0-8 1.5-16t4.5-16l80-184h-6q-17 0-28.5-11.5T120-800v-40q0-17 11.5-28.5T160-880h280q17 0 28.5 11.5T480-840v40q0 17-11.5 28.5T440-760h-6l66 152q-19 10-36 21t-32 25l-84-198h-96l-92 216v304h170q5 21 13.5 41.5T364-160H160Zm480-440q-42 0-71-29t-29-71q0-42 29-71t71-29v200q0-42 29-71t71-29q42 0 71 29t29 71H640Z"
                />
            </svg>
        </mat-icon>
        <p>Oat milk is available upon request</p>
    </div>
    <div class="text-center lg:text-2xl: md:text-xl text-lg font-bold">
        ORDER
    </div>
    <div class="flex justify-center gap-4">
        <a
            mat-icon-button
            matTooltip="Google"
            href="https://www.google.com/viewer/chooseprovider/?mid=/g/11l5x5k_0j"
            target="_blank"
        >
            <img src="svgs/google.svg" alt="Google" />
        </a>
        <a
            mat-icon-button
            matTooltip="Uber Eats"
            href="https://www.ubereats.com/store/haru-fresh-juice-cartoon/nVU5b1E7TnST0jYGqDDSaw?diningMode=DELIVERY&sc=SEARCH_SUGGESTION"
            target="_blank"
        >
            <img src="svgs/uber-eats.svg" alt="Uber Eats" />
        </a>
        <a
            mat-icon-button
            matTooltip="Clover"
            href="https://www.clover.com/online-ordering/haru-fresh-juice-cartoon-sterling-heights"
            target="_blank"
        >
            <img src="svgs/clover-logo.svg" alt="Clover" />
        </a>
        <!-- <button mat-icon-button>
        <a
          href=""
          target="_blank">
          <img
            src="svgs/bento-box.svg"
            alt="Bento Box" />
        </a>
      </button> -->
        <a
            mat-icon-button
            matTooltip="Grubhub"
            href="https://www.grubhub.com/restaurant/haru-cafe-11445-15-mile-road-sterling-heights/7394008"
            target="_blank"
        >
            <img src="svgs/grubhub.svg" alt="GrubHub" />
        </a>
        <a
            mat-button
            matTooltip="Seamless (powered by Grubhub)"
            href="https://www.seamless.com/menu/haru-cafe-11445-15-mile-road-sterling-heights/7394008?utm_source=google&utm_medium=organic&utm_campaign=place-action-link&pickup=true&rwg_token=AAiGsoa0yDDk53TjyWQhiBoYlVxEmeZa97TDwzTpPD287xcz69CsKJ2OsZ329fq2omDdd2NZhy2CZpw2eBEdYlR3_ejvzGlumw%3D%3D"
            target="_blank"
        >
            <img class="h-4" src="svgs/seamless.svg" alt="Seamless" />
        </a>
    </div>
    <div class="lg:text-2xl: md:text-xl text-lg text-center font-bold">
        SEARCH OUR MENU
    </div>
    <haru-filters></haru-filters>
    <div class="mt-8">
        <p-carousel
            [value]="pagedMenuItems()"
            [numVisible]="1"
            [numScroll]="1"
            [circular]="pagedMenuItems().length > 1"
            [showIndicators]="true"
            [showNavigators]="false"
        >
            <ng-template #item let-pageOfMenuItems>
                <div
                    class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 lg:grid-rows-3 gap-4 h-full"
                >
                    @for (menuItem of pageOfMenuItems; track $index) {
                        <haru-menu-item
                            #menuItemRef
                            [menuItem]="menuItem"
                        ></haru-menu-item>
                    }
                    @for (
                        empty of createEmptyArray(
                            pageSize - pageOfMenuItems.length
                        );
                        track $index
                    ) {
                        <div class="h-full"></div>
                    }
                </div>
            </ng-template>
        </p-carousel>
    </div>

    <!-- location -->
    <haru-footer id="location"></haru-footer>
</div>
