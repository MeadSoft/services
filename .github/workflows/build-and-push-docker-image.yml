name: Build and Push Container Image

on:
    workflow_dispatch:
        inputs:
            app-name:
                description: "Name of the application to build"
                required: true
                type: choice
                options:
                    - frontend
                    - restaurant-catalog-api
            version:
                description: "Version of the application"
                required: true
                type: string
            environment:
                description: "Target environment (production, development, etc.)"
                required: false
                type: choice
                options:
                    - production
                    - development
                default: "production"
    workflow_call:
        inputs:
            app-name:
                description: "Name of the application to build"
                required: true
                type: string
            version:
                description: "Version of the application"
                required: true
                type: string
            environment:
                description: "Target environment (production, development, etc.)"
                required: false
                type: string
                default: "production"

jobs:
    build:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - uses: actions/checkout@v4

            - name: Authenticate to Google Cloud
              id: auth
              uses: google-github-actions/auth@v2
              with:
                  token_format: access_token
                  workload_identity_provider: projects/764108434612/locations/global/workloadIdentityPools/github-pool/providers/github
                  service_account: meadsoft-dev-sa@smart-quasar-297403.iam.gserviceaccount.com

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to Artifact Registry
              uses: docker/login-action@v3
              with:
                  registry: us-docker.pkg.dev
                  username: oauth2accesstoken
                  password: ${{ steps.auth.outputs.access_token }}

            - name: Extract metadata for Container
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: us-docker.pkg.dev/smart-quasar-297403/repo/${{ inputs.app-name }}
                  tags: |
                      type=semver,pattern={{version}},value=${{ inputs.version }}
                      type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }}
                      type=semver,pattern={{major}},value=${{ inputs.version }}
                      type=raw,value=${{ inputs.version }}
                      type=raw,value=latest
                      type=sha,prefix=sha-

            - name: Build and push Container image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  file: ./apps/${{ inputs.app-name }}/Containerfile
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  build-args: |
                      APP_ENV=${{ inputs.environment }}
                      APP_NAME=${{ inputs.app-name }}
                      VERSION=${{ inputs.version }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
