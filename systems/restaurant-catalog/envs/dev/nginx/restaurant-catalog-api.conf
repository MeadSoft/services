# Restaurant Catalog API — NestJS reverse proxy
#
# The NestJS app runs as a Docker container on port 3000 with:
#   - Global prefix:  /api
#   - Swagger UI:     /swagger
#
# Deploy steps:
#   1. Start container: docker run -d --name restaurant-catalog-http-api \
#        --env-file /etc/restaurant-catalog-http-api/.env \
#        -p 127.0.0.1:3000:3000 \
#        restaurant-catalog-http-api:latest
#   2. Symlink: ln -s /etc/nginx/sites-available/restaurant-catalog-http-api.conf \
#        /etc/nginx/sites-enabled/
#   3. Reload: nginx -t && systemctl reload nginx
#
# NOTE: After deployment update the CORS origin in the NestJS app to allow
#       the website domain (currently hard-coded to localhost in main.ts).

upstream restaurant_catalog_http_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name API_DOMAIN;  # e.g. api.haru-cafe.example.com

    # ── Proxy shared settings ──────────────────────────────────────────────────
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Required for keepalive upstream connections
    proxy_set_header Connection        "";

    # Pass cookies through unchanged (app uses cookie-based JWT sessions)
    proxy_pass_header Set-Cookie;

    # ── Timeouts ───────────────────────────────────────────────────────────────
    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;
    proxy_send_timeout    60s;

    # ── Buffer tuning ──────────────────────────────────────────────────────────
    proxy_buffering    on;
    proxy_buffer_size  8k;
    proxy_buffers      8 16k;

    # ── API routes (/api/*) ────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://restaurant_catalog_http_api;
    }

    # ── Swagger UI (/swagger) ──────────────────────────────────────────────────
    location /swagger {
        proxy_pass http://restaurant_catalog_http_api;
    }

    # ── Health / root ──────────────────────────────────────────────────────────
    # Catch-all: forward everything else to the app rather than returning 404
    # from nginx. Allows NestJS to own its own 404 responses.
    location / {
        proxy_pass http://restaurant_catalog_http_api;
    }

    # ── Security headers ───────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
