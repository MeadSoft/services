# Haru Café Website — Static Angular SPA
#
# Deploy steps:
#   1. Build: pnpx nx build haru-cafe-website
#   2. Copy to server: rsync -a apps/haru-cafe-website/dist/haru-cafe/browser/ \
#        user@host:/var/www/haru-cafe/browser/
#   3. Symlink: ln -s /etc/nginx/sites-available/haru-cafe-website.conf \
#        /etc/nginx/sites-enabled/
#   4. Reload: nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name WEBSITE_DOMAIN;  # e.g. haru-cafe.example.com

    root /var/www/haru-cafe/browser;
    index index.html;

    # ── Compression ────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Long-lived cache for content-hashed assets ─────────────────────────────
    # Angular CLI adds a content hash to JS/CSS bundles, so these are safe to
    # cache indefinitely.
    location ~* \.(js|css|woff2?|ttf|eot|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Images and icons — slightly shorter cache since they may not be hashed
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── SPA fallback ───────────────────────────────────────────────────────────
    # Any path that does not match a real file is served as index.html so the
    # Angular router handles it client-side.
    location / {
        try_files $uri $uri/ /index.html;

        # Prevent caching of index.html itself so the app shell is always fresh
        location = /index.html {
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # ── Security headers ───────────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Allow Firebase Auth popups (required for Google sign-in)
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
}
